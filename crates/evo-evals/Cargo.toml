[package]
name = "evo-evals"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version = "0.1.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Evals of the Evo harness: scripted scenarios, golden replay, case sets and an opt-in live tier"
publish = false

[[bin]]
name = "evo-evals"
path = "src/main.rs"

[dependencies]
evo-engine = { workspace = true }
evo-ai = { workspace = true }
evo-store = { workspace = true }
evo-mesh = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
sha2 = "0.10"
regex = { workspace = true }
