<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sticky Wall</title>
  <link rel="stylesheet" href="style.css">
  <script src="notes-store.js"></script>
  <script src="wall.js" defer></script>
</head>
<body>
  <h1>Sticky Wall</h1>
  <p class="hint">Notes kept by this plugin. Drag to reorder. Ctrl+Enter adds.</p>
  <div class="row">
    <textarea id="text" rows="2" placeholder="Write a note…" class="grow"></textarea>
  </div>
  <div class="row" style="margin-top: 6px">
    <select id="color">
      <option value="yellow">Yellow</option>
      <option value="pink">Pink</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
    </select>
    <label class="row"><input id="pin" type="checkbox" style="width: auto"> Pin to the open chat</label>
    <span class="grow"></span>
    <button id="add" class="primary">Add note</button>
  </div>
  <div id="wall" class="wall"></div>
</body>
</html>
