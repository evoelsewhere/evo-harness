[package]
name = "evo-desktop"
version = "4.2.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "evo desktop app shell: runs evo-engine as a child process and bridges its JSONL protocol to the web UI"
publish = false

# Standalone workspace: kept out of the engine workspace so engine builds and
# CI do not need the platform webview libraries Tauri links against.
[workspace]

[lib]
name = "evo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` enables the transparent window that macOS vibrancy needs.
# `unstable`: child webviews, for the in-app browser (src/browser.rs).
tauri = { version = "2", features = ["macos-private-api", "devtools", "tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# Settings → General: run on startup, and one running copy of the app.
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.8"
serde = { version = "1", features = ["derive"] }
# The app database (schema, migrations, chats, logs), shared with the engine.
evo-store = { path = "../../../crates/evo-store" }
# Managed Git worktrees: review, apply, discard, worktree sessions.
evo-worktrees = { path = "../../../crates/evo-worktrees" }
# The session mesh hub: mail between chats' engines (src/mesh.rs).
evo-mesh = { path = "../../../crates/evo-mesh" }
evo-mcp = { path = "../../../crates/evo-mcp" }
evo-plugins = { path = "../../../crates/evo-plugins" }
serde_json = "1"
# Agent tools the shell answers: cancel a call the engine dropped (src/agent_tools).
tokio-util = "0.7"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt", "time"] }
# Terminal tools: regular expressions for waitFor, password prompts (src/agent_tools/terminal.rs).
regex = "1"
# Scheduler tools: next run of a schedule on the local clock (src/agent_tools/scheduler).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# "Open in" menu: app icons as PNG data URLs.
base64 = "0.23"
# Side panel terminal: a pseudo-terminal per tab (ConPTY on Windows).
portable-pty = "0.9"
# Files tool: workspace search that honours .gitignore.
ignore = "0.4"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
png = "0.18"

[target.'cfg(unix)'.dependencies]
# Terminal: kill a shell's whole process group.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# App icons from the shell image factory (src/apps.rs); computer app control
# (src/agent_tools/computer): window listing and capture, UI Automation and
# MSAA, posted messages, the app catalog. Same version as webview2-com's.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# Computer app control: the Start menu's programs for the app catalog.
walkdir = "2"
# Computer app control: text to type is composed (NFC) first, as a keyboard types it.
unicode-normalization = "0.1"
# Computer app control: screenshots and card frames (PNG, JPEG).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# In-app browser: the WebView2 DevTools Protocol (screenshots, real input). Same versions as wry's.
webview2-com = "0.39"
windows-core = "0.62"

# Computer app control live tests: a WebView2 host laid out like a WebView2
# chat app. Both already come in through Tauri (same versions).
[target.'cfg(target_os = "windows")'.dev-dependencies]
tao = "0.37"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
# App icons from NSWorkspace.
file_icon_provider = "0.4"

# Keep debug builds small: full DWARF for every dependency made target/ grow to
# 150+ GB. Line tables still give file:line in backtraces and panics.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
